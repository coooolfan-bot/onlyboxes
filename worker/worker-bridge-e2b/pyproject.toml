[project]
name = "worker-bridge-e2b"
version = "0.1.0"
description = "Onlyboxes worker bridge for e2b sandboxes"
requires-python = ">=3.14"
dependencies = [
    "e2b>=2.19.0",
    "e2b-code-interpreter>=2.6.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=6.31.1",
    "python-dotenv>=1.2.2",
    "structlog>=24.0.0",
]

[project.scripts]
worker-bridge-e2b = "worker_bridge_e2b.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_bridge_e2b"]

[tool.hatch.build.targets.editable]
packages = ["src/worker_bridge_e2b"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "ty>=0.0.28",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/proto/**/*_pb2.py", "**/proto/**/*_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["worker_bridge_e2b"]

[tool.ty.src]
include = ["src"]
exclude = ["src/worker_bridge_e2b/proto/**"]

[tool.ty.analysis]
allowed-unresolved-imports = ["grpc", "worker_bridge_e2b.proto"]

[tool.ty.rules]
unresolved-attribute = "ignore"
